services:
  app:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: whatsgood
      POSTGRES_PASSWORD: whatsgood
      POSTGRES_DB: whatsgood
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whatsgood"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
