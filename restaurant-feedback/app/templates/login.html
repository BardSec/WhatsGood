{% extends "base.html" %}

{% block title %}Log in — I'll Have What She's Having{% endblock %}

{% block content %}
<section class="auth-section">
    <h1>Welcome back</h1>
    <p>Log in to add dishes and share your reviews.</p>

    <form method="post" action="{{ url_for('auth.demo_login') }}" class="auth-form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <label for="name">Display name</label>
        <input type="text" id="name" name="name" required placeholder="Your name">

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required placeholder="you@example.com">

        <button type="submit" class="btn btn-block">Log in (demo)</button>
    </form>
    <p class="auth-note">This is a demo login. Configure OIDC environment variables for production authentication.</p>
</section>
{% endblock %}
